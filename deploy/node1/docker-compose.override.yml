# node-1 as an API/Caddy standby and, after promotion, the primary.
#
# PostgreSQL runs as the system cluster: 5433 is the physical standby, 5432 is
# HAProxy. While node-2 is healthy HAProxy sends the API to the node-2 primary;
# after fencing/promotion it falls back to the local promoted standby.
services:
  webnestdev-server:
    # Дверь публичных предпросмотров должна быть доступна с node-2 по приватной сети:
    # вторая реплика проксирует запрос владельцу preview (см. preview/peer-door.ts).
    ports:
      - "10.0.0.4:8788:8788"
    # DATA_DIR должен быть общим: при переключении API на node-2 платформенные ключи
    # и настройки должны быть те же, что на node-1. Gluster-том монтируется вместо
    # именованного тома compose.
    volumes:
      - /var/lib/webnestdev/data:/app/.webnestdev
    environment:
      DATABASE_URL: postgres://webnestdev:${NODE2_PG_PASSWORD:?Set NODE2_PG_PASSWORD}@host.docker.internal:5432/webnestdev
      WEBNESTDEV_NODE_ID: node-1
      WEBNESTDEV_NODE_ADDRESS: 10.0.0.4:8790
      WEBNESTDEV_RUNNER_TOKEN: ${NODE1_RUNNER_TOKEN:?Set NODE1_RUNNER_TOKEN}
      WEBNESTDEV_REMOTE_NODES: '[{"id":"node-2","address":"10.0.0.5:8790"}]'
      WEBNESTDEV_SHARED_SANDBOX: "1"
      WEBNESTDEV_AUTO_MOVE_PROJECTS: "1"
      HOSTING_SHARED_STORAGE: "1"
      # 6.3: после публикации сайта сбрасываем кеш общего CDN-ресурса.
      HOSTING_CDN_PURGE: "1"
      HOSTING_CDN_RESOURCE: hosting
      HOSTING_CDN_PROJECT: project-pimashin2015
      WEBNESTDEV_TRUSTED_PROXIES: 172.30.0.0/24
      # 5.1 включён 10.11.2026: allowlist + правила DOCKER-USER. Аварийный выключатель —
      # EGRESS_MODE: private-only, затем EGRESS_ENFORCE: "0" (см. docs/SCALING_3000_PLAN.md 5.1).
      EGRESS_MODE: allowlist
      EGRESS_ENFORCE: "1"
      PREVIEW_MAX_CONTAINERS: "2"
      # Runtime-preview после возврата из отдельной вкладки: две минуты без запросов.
      # Sweep раз в 30 секунд, чтобы остановка наступала около 2:00–2:30, а не к третьей минуте.
      PREVIEW_IDLE_MS: "120000"
      PREVIEW_SWEEP_MS: "30000"
      # Hybrid легче Docker: замер на ноде — 12 hybrid. Для production берём 8
      # (запас на реальные backend'ы), общий бюджет 12 слотов, Docker весит 6.
      PREVIEW_MAX_HYBRID: "8"
      PREVIEW_HOST_UNITS: "12"
      PREVIEW_CONTAINER_UNITS: "6"
      SANDBOX_MAX_CONCURRENT: "2"
    extra_hosts:
      - "host.docker.internal:10.0.0.4"

  caddy:
    depends_on: []
