# node-1 as an API/Caddy standby and, after promotion, the primary.
#
# PostgreSQL runs as the system cluster: 5433 is the physical standby, 5432 is
# HAProxy. While node-2 is healthy HAProxy sends the API to the node-2 primary;
# after fencing/promotion it falls back to the local promoted standby.
services:
  webnestdev-server:
    # Дверь публичных предпросмотров должна быть доступна с node-2 по приватной сети:
    # вторая реплика проксирует запрос владельцу preview (см. preview/peer-door.ts).
    ports:
      - "10.0.0.4:8788:8788"
      # Приватный внутренний API для owner-routing. Пока routing выключен, дверь не слушает.
      - "10.0.0.4:8791:8791"
    # DATA_DIR должен быть общим: при переключении API на node-2 платформенные ключи
    # и настройки должны быть те же, что на node-1. Gluster-том монтируется вместо
    # именованного тома compose.
    volumes:
      - /var/lib/webnestdev/data:/app/.webnestdev
    # Административная строка клиентской базы — локальный файл ноды, не git и не .env.
    # Без файла фича остаётся выключенной, deploy не падает.
    env_file:
      - path: /etc/webnestdev/client-db-admin.conf
        required: false
    environment:
      DATABASE_URL: postgres://webnestdev:${NODE2_PG_PASSWORD:?Set NODE2_PG_PASSWORD}@host.docker.internal:5432/webnestdev
      WEBNESTDEV_NODE_ID: node-1
      WEBNESTDEV_NODE_ADDRESS: 10.0.0.4:8790
      WEBNESTDEV_API_ADDRESS: 10.0.0.4:8791
      WEBNESTDEV_WORKSPACE_MODE: "local"
      WEBNESTDEV_OWNER_ROUTING: "1"
      # Внутренняя дверь использует уже существующий общий секрет нод, чтобы не хранить
      # второй токен в git или в новом файле окружения.
      WEBNESTDEV_INTERNAL_TOKEN: ${NODE1_RUNNER_TOKEN:?Set NODE1_RUNNER_TOKEN}
      WEBNESTDEV_RUNNER_TOKEN: ${NODE1_RUNNER_TOKEN:?Set NODE1_RUNNER_TOKEN}
      WEBNESTDEV_REMOTE_NODES: '[{"id":"node-2","address":"10.0.0.5:8790"}]'
      WEBNESTDEV_SHARED_SANDBOX: "1"
      WEBNESTDEV_AUTO_MOVE_PROJECTS: "1"
      HOSTING_SHARED_STORAGE: "1"
      # POST к функциям идёт на api.nestdev.ru, CDN остаётся для статики.
      HOSTING_API_HOST: api.nestdev.ru
      # 6.3: после публикации сайта сбрасываем кеш общего CDN-ресурса.
      HOSTING_CDN_PURGE: "1"
      HOSTING_CDN_RESOURCE: hosting
      HOSTING_CDN_PROJECT: project-pimashin2015
      WEBNESTDEV_TRUSTED_PROXIES: 172.30.0.0/24
      # Клиентская база (пилот): административная строка приходит из локального env_file.
      # Без неё фича выключена и маршрут отвечает 503. Публичный адрес — PgBouncer этой ноды.
      CLIENT_DB_PUBLIC_HOST: ${CLIENT_DB_PUBLIC_HOST:-10.0.0.4}
      CLIENT_DB_PORT: ${CLIENT_DB_PORT:-6432}
      CLIENT_DB_NAME: ${CLIENT_DB_NAME:-app}
      # Пилотный PgBouncer слушает без TLS внутри приватной сети.
      CLIENT_DB_SSL: ${CLIENT_DB_SSL:-0}
      # 5.1 включён 10.11.2026: allowlist + правила DOCKER-USER. Аварийный выключатель —
      # EGRESS_MODE: private-only, затем EGRESS_ENFORCE: "0" (см. docs/SCALING_3000_PLAN.md 5.1).
      EGRESS_MODE: allowlist
      EGRESS_ENFORCE: "1"
      PREVIEW_MAX_CONTAINERS: "2"
      # Runtime-preview после возврата из отдельной вкладки: три минуты без запросов.
      # Sweep раз в 30 секунд, чтобы остановка наступала около 3:00–3:30.
      PREVIEW_IDLE_MS: "180000"
      # Static — слушатель, а не контейнер: держим пятнадцать минут без действий.
      PREVIEW_STATIC_IDLE_MS: "900000"
      PREVIEW_SWEEP_MS: "30000"
      # Hybrid легче Docker: замер на ноде — 12 hybrid. Для production берём 8
      # (запас на реальные backend'ы), общий бюджет 12 слотов, Docker весит 6.
      PREVIEW_MAX_HYBRID: "8"
      PREVIEW_HOST_UNITS: "12"
      PREVIEW_CONTAINER_UNITS: "6"
      # Четыре контейнера команд одновременно. Замер 25.11.2026, 21:57 UTC: четыре лёгкие
      # команды (`ls`, `git status`) идут параллельно и пачка выполняется за 5.3 с вместо 9.5 с
      # при двух слотах; память при этом не упирается.
      SANDBOX_MAX_CONCURRENT: "4"
      # Бюджет памяти задан явно, а не выведен из слотов: по умолчанию он считается как
      # SANDBOX_MEMORY_MB × SANDBOX_MAX_CONCURRENT, то есть 4 × 1024 = 4096 МБ — больше, чем вся
      # машина (3886 МБ). 2048 МБ — измеренный потолок: на хосте остаётся ~1.1 ГБ на PostgreSQL,
      # Caddy и API. Отсюда следствие: четыре лёгкие команды (по 256 МБ) идут одновременно, а
      # тяжёлые сборки и установки (по 1024 МБ) — не больше двух; остальные ждут в очереди.
      SANDBOX_MEMORY_BUDGET_MB: "2048"
    extra_hosts:
      - "host.docker.internal:10.0.0.4"

  caddy:
    depends_on: []
