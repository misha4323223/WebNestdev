global
    log /dev/log local0
    maxconn 200
    daemon
defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout client 60m
    timeout server 60m
frontend pg
    bind 0.0.0.0:5432
    default_backend pg_servers
backend pg_servers
    balance first
    option tcp-check
    # После promotion node-1 — единственный primary. node-2 возвращается как
    # standby/worker и не получает трафик API, пока роль не вернут планово.
    server local 127.0.0.1:5433 check
