# Вторая ВМ: тот же образ и Caddy, но PostgreSQL — системный кластер на хосте.
# Compose запускается с `--no-deps`, поэтому сервис postgres из основного файла не поднимается.
services:
  webnestdev-server:
    # Вторая реплика принимает публичный трафик и должна уметь отдать preview, запущенный
    # на node-1: её дверь проксирует запрос на приватную дверь владельца.
    ports:
      - "10.0.0.5:8788:8788"
    # Тот же общий DATA_DIR, что на node-1; без него ключи платформы и настройки
    # остаются в локальном именованном томе и после переключения теряются.
    volumes:
      - /var/lib/webnestdev/data:/app/.webnestdev
    environment:
      DATABASE_URL: postgres://webnestdev:${NODE2_PG_PASSWORD:?Set NODE2_PG_PASSWORD}@host.docker.internal:5432/webnestdev
      WEBNESTDEV_NODE_ID: node-2
      WEBNESTDEV_NODE_ADDRESS: 10.0.0.5:8790
      # node-1 после падения возвращается не как API, а как runner: token и адрес
      # регистрируются здесь, а общий NFS-каталог виден обоим узлам.
      WEBNESTDEV_RUNNER_TOKEN: ${NODE1_RUNNER_TOKEN:?Set NODE1_RUNNER_TOKEN}
      WEBNESTDEV_REMOTE_NODES: '[{"id":"node-1","address":"10.0.0.4:8790"}]'
      WEBNESTDEV_SHARED_SANDBOX: "1"
      # Если node-1 выпала, проект, закреплённый за ней, можно открыть на node-2:
      # общий каталог уже есть, меняется только pin (без живого preview/задания).
      WEBNESTDEV_AUTO_MOVE_PROJECTS: "1"
      # node-1 публикует сайты через общий SANDBOX_DIR, а релизы пишет API node-2
      # в свой SITES_DIR; для сайта проекта с node-1 это общий storage с точки зрения API.
      HOSTING_SHARED_STORAGE: "1"
      # 6.3: после публикации сайта сбрасываем кеш общего CDN-ресурса.
      HOSTING_CDN_PURGE: "1"
      HOSTING_CDN_RESOURCE: hosting
      HOSTING_CDN_PROJECT: project-pimashin2015
      WEBNESTDEV_TRUSTED_PROXIES: 172.30.0.0/24
      # 5.1 включён 10.11.2026: allowlist + правила DOCKER-USER (ставит node2-sync.sh).
      # Аварийный выключатель — private-only, затем EGRESS_ENFORCE: "0".
      EGRESS_MODE: allowlist
      EGRESS_ENFORCE: "1"
      PREVIEW_MAX_CONTAINERS: "2"
      # Runtime-preview после возврата из отдельной вкладки: две минуты без запросов.
      # Sweep раз в 30 секунд, чтобы остановка наступала около 2:00–2:30, а не к третьей минуте.
      PREVIEW_IDLE_MS: "120000"
      PREVIEW_SWEEP_MS: "30000"
      # Hybrid легче Docker: замер на ноде — 12 hybrid. Для production берём 8
      # (запас на реальные backend'ы), общий бюджет 12 слотов, Docker весит 6.
      PREVIEW_MAX_HYBRID: "8"
      PREVIEW_HOST_UNITS: "12"
      PREVIEW_CONTAINER_UNITS: "6"
      SANDBOX_MAX_CONCURRENT: "2"
    extra_hosts:
      - "host.docker.internal:10.0.0.5"

  caddy:
    depends_on: []
