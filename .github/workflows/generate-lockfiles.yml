name: Generate npm lockfiles

on:
  push:
    branches: ["feat/agent-verify-loop"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate root workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate standalone server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
          else
            git commit -m "build: add reproducible npm lockfiles"
            git push
          fi
