name: deploy

# Деплой на ВМ: GitHub Actions собирает Docker-образ, кладёт его в GHCR и выполняет
# deploy/scripts/vm-deploy.sh на сервере (по SSH или локально на self-hosted runner).
#
# Выкатка идёт в прод автоматически: push в main собирает образ, прогоняет тесты
# (`npm test`), публикует образ в GHCR и раскатывает его на ВМ — блок `push` ниже включён,
# а не «закомментирован на время разработки». То есть push в main = деплой прода.
#
# Ручной запуск кнопкой «Run workflow» нужен для всего остального и ничего не отменяет:
# mode=image с тегом `image=…:sha-<12>` откатывает на прежнюю сборку, mode=prune убирает
# старые образы с ВМ, mode=cleanup обнуляет логи контейнеров на ВМ (диск, а не версию),
# mode=logs печатает последние строки логов сервиса в лог выкатки, mode=source собирает
# образ на самой ВМ из репозитория, mode=disk показывает, чем занят диск (Docker, тома,
# песочницы, логи) — без уборки и без перезапуска сервиса.
# Подтверждение перед выкаткой включается без изменения файла:
# Settings → Environments → production → Required reviewers (сейчас их нет).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "image — готовый образ из реестра, source — сборка на ВМ из репозитория, repair — починить запущенный сервис без смены версии, logs — показать логи контейнера, cleanup — только обнулить логи, prune — только уборка старых образов, disk — показать, что занимает место на диске"
        type: choice
        options: ["image", "source", "repair", "logs", "cleanup", "prune", "disk"]
        default: "image"
      tail:
        description: "Сколько последних строк логов контейнера печатать в mode=logs (по умолчанию 120)"
        type: string
        required: false
      image:
        description: "Тег образа для выкатки или отката, например sha-1a2b3c4d5e6f (по умолчанию — сборка этого запуска)"
        type: string
        required: false
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # В режиме source образ не нужен: на ВМ собирается код из репозитория.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'image' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/misha4323223/webnestdev
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: server

      - name: Test server
        run: npm test
        working-directory: server

      - name: Build web and server
        run: npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image tag
        id: tag
        run: echo "image=$IMAGE_NAME:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          # SHA попадает в образ: GET /api/health отдаёт его как build, и выкатка
          # проверяет по нему, что на ВМ поднялась именно эта версия.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # build пропускается в режиме source, и тогда деплой всё равно должен выполняться.
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    # Переменная репозитория DEPLOY_RUNNER переключает деплой на self-hosted runner,
    # установленный на самой ВМ (нужно, если у неё нет доступного извне SSH).
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the SSH key
        if: ${{ vars.DEPLOY_RUNNER == '' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        if: ${{ vars.DEPLOY_RUNNER == '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'image' }}
          LOG_TAIL: ${{ inputs.tail }}
          IMAGE_INPUT: ${{ inputs.image }}
          BUILT_IMAGE: ${{ needs.build.outputs.image }}
          # Ключ сервисного аккаунта Yandex Cloud (файл JSON целиком). Необязательный: без него
          # выкатка идёт как раньше, а SMS остаётся нерабочим и говорит об этом в логе.
          YANDEX_SA_KEY_JSON: ${{ secrets.YANDEX_SA_KEY_JSON }}
          # Те же ключи можно ввести в панели «Ключи сервера» — тогда здесь ничего не нужно.
          # Значения отсюда — запасной источник для чистой ВМ: они попадают в .env, а панель
          # остаётся важнее (её значения лежат в DATA_DIR и переживают выкатку).
          # GitHub запрещает секреты и переменные с префиксом GITHUB_ (он зарезервирован под
          # служебные значения), поэтому в настройках репозитория эти два ключа называются
          # GH_OAUTH_CLIENT_ID / GH_OAUTH_CLIENT_SECRET, а в .env попадают под обычными именами,
          # которые читает сервер.
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID || vars.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET || vars.GH_OAUTH_CLIENT_SECRET }}
          GH_CALLBACK_URL: ${{ vars.GH_CALLBACK_URL }}
          GH_FRONTEND_URL: ${{ vars.GH_FRONTEND_URL }}
          # GitLab OAuth. Имена GITLAB_* GitHub не резервирует, поэтому секреты называются так же,
          # как переменные сервера; пустые значения ничего не стирают на ВМ.
          GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID || vars.GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET || vars.GITLAB_CLIENT_SECRET }}
          GITLAB_BASE_URL: ${{ vars.GITLAB_BASE_URL }}
          GITLAB_CALLBACK_URL: ${{ vars.GITLAB_CALLBACK_URL }}
          GITLAB_FRONTEND_URL: ${{ vars.GITLAB_FRONTEND_URL }}
          # GitVerse OAuth: имена не зарезервированы GitHub, поэтому секреты называются так же,
          # как переменные сервера. Без этих двух строк ключи из Secrets до сервера не доезжают.
          GITVERSE_CLIENT_ID: ${{ secrets.GITVERSE_CLIENT_ID || vars.GITVERSE_CLIENT_ID }}
          GITVERSE_CLIENT_SECRET: ${{ secrets.GITVERSE_CLIENT_SECRET || vars.GITVERSE_CLIENT_SECRET }}
          YANDEX_CLOUD_ID: ${{ secrets.YANDEX_CLOUD_ID }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          # Yandex ID OAuth. Префикс YANDEX_ GitHub разрешает (зарезервирован только GITHUB_).
          # `secrets.X || vars.X`: GitHub не отличает «секрет не заведён» от «заведён пустым»,
          # а ключ, сохранённый во вкладке Variables, приходил пустым — кнопка «Подключить»
          # тогда отвечала «OAuth не настроен». Читаются оба места.
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID || vars.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET || vars.YANDEX_CLIENT_SECRET }}
          YANDEX_CALLBACK_URL: ${{ vars.YANDEX_CALLBACK_URL }}
          YANDEX_FRONTEND_URL: ${{ vars.YANDEX_FRONTEND_URL }}
          YANDEX_OAUTH_SCOPE: ${{ vars.YANDEX_OAUTH_SCOPE }}
          # Веб-поиск агента. Ключ Yandex Search API — отдельный (сервисный аккаунт со scope
          # yc.search-api.execute), это не тот ключ, что нужен SMS. Tavily — резерв платных
          # тарифов. Пустые значения не передаются и ничего не стирают на ВМ.
          WEB_SEARCH_PROVIDER: ${{ secrets.WEB_SEARCH_PROVIDER || vars.WEB_SEARCH_PROVIDER }}
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY || vars.YANDEX_SEARCH_API_KEY }}
          YANDEX_SEARCH_FOLDER_ID: ${{ secrets.YANDEX_SEARCH_FOLDER_ID || vars.YANDEX_SEARCH_FOLDER_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || vars.TAVILY_API_KEY }}
          # AI платформы: платная модель — основная для подписок и резерв для бесплатного тарифа.
          # Бесплатная цепочка (Agnes AI) — три ключа из разных аккаунтов, по порядку.
          PLATFORM_AI_BASE_URL: ${{ secrets.PLATFORM_AI_BASE_URL || vars.PLATFORM_AI_BASE_URL }}
          PLATFORM_AI_MODEL: ${{ secrets.PLATFORM_AI_MODEL || vars.PLATFORM_AI_MODEL }}
          PLATFORM_AI_PROVIDER: ${{ secrets.PLATFORM_AI_PROVIDER || vars.PLATFORM_AI_PROVIDER }}
          PLATFORM_AI_API_KEY: ${{ secrets.PLATFORM_AI_API_KEY }}
          PLATFORM_AI_FREE_BASE_URL: ${{ secrets.PLATFORM_AI_FREE_BASE_URL || vars.PLATFORM_AI_FREE_BASE_URL }}
          PLATFORM_AI_FREE_MODEL: ${{ secrets.PLATFORM_AI_FREE_MODEL || vars.PLATFORM_AI_FREE_MODEL }}
          PLATFORM_AI_FREE_KEY_1: ${{ secrets.PLATFORM_AI_FREE_KEY_1 }}
          PLATFORM_AI_FREE_KEY_2: ${{ secrets.PLATFORM_AI_FREE_KEY_2 }}
          PLATFORM_AI_FREE_KEY_3: ${{ secrets.PLATFORM_AI_FREE_KEY_3 }}
          # Холодный ярус проектов: S3-совместимый бакет МТС Web Services (docs/STORAGE.md).
          # Адрес, бакет и регион — не секреты, их можно завести в Variables; ключи — только
          # в Secrets. Пустые значения не передаются: незаведённый ключ не стирает настройку ВМ.
          PLATFORM_S3_ENDPOINT: ${{ secrets.PLATFORM_S3_ENDPOINT || vars.PLATFORM_S3_ENDPOINT }}
          PLATFORM_S3_BUCKET: ${{ secrets.PLATFORM_S3_BUCKET || vars.PLATFORM_S3_BUCKET }}
          PLATFORM_S3_REGION: ${{ secrets.PLATFORM_S3_REGION || vars.PLATFORM_S3_REGION }}
          PLATFORM_S3_PREFIX: ${{ secrets.PLATFORM_S3_PREFIX || vars.PLATFORM_S3_PREFIX }}
          PLATFORM_S3_ACCESS_KEY_ID: ${{ secrets.PLATFORM_S3_ACCESS_KEY_ID }}
          PLATFORM_S3_SECRET_ACCESS_KEY: ${{ secrets.PLATFORM_S3_SECRET_ACCESS_KEY }}
          # 1 включает уборку простаивающих проектов в бакет; 0/пусто — проекты остаются на диске.
          PROJECT_ARCHIVE_ENABLED: ${{ secrets.PROJECT_ARCHIVE_ENABLED || vars.PROJECT_ARCHIVE_ENABLED }}
          # Минуты простоя до переезда в бакет. Дни остаются поддерживаемым старым ключом,
          # но новый ключ важнее (см. server/src/storage/archive-scheduler.ts).
          PROJECT_ARCHIVE_IDLE_MINUTES: ${{ secrets.PROJECT_ARCHIVE_IDLE_MINUTES || vars.PROJECT_ARCHIVE_IDLE_MINUTES }}
          WEBNESTDEV_ADMIN_EMAILS: ${{ secrets.WEBNESTDEV_ADMIN_EMAILS }}
          WEBNESTDEV_ADMIN_USER_IDS: ${{ secrets.WEBNESTDEV_ADMIN_USER_IDS }}
        run: |
          set -euo pipefail
          # Чистим переменные от скрытых символов (CRLF из Windows при вставке секретов)
          DEPLOY_USER=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          DEPLOY_HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '[:space:]')
          image="$IMAGE_INPUT"
          [ -n "$image" ] || image="$BUILT_IMAGE"
          # Значение приходит из поля ввода, поэтому перед подстановкой в команду на ВМ
          # оно проверяется: только буквы, цифры и знаки, допустимые в имени образа.
          if [ -n "$image" ] && ! printf '%s' "$image" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*:[A-Za-z0-9._-]+$'; then
            echo "Недопустимый тег образа: $image" >&2
            exit 1
          fi
          # Файл сервисов едет на ВМ вместе со скриптом: выкатка образа раньше не касалась
          # compose, и ВМ молча оставалась со старым — без SANDBOX_DIR и монтирования песочниц.
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)
          # Конфигурация фронта с HTTPS едет тем же способом, что и файл сервисов: иначе ВМ
          # осталась бы с прежним Caddyfile, и правка публичных адресов предпросмотра
          # требовала бы захода на сервер руками.
          CADDY_B64=$(base64 -w0 deploy/Caddyfile)
          # Ключи платформы и админ панели — тем же способом: файл, а не аргумент команды.
          # Пустое значение не передаётся вовсе: незаведённый секрет не должен стирать
          # настройку, которую уже сделали на ВМ.
          PLATFORM_ENV_FILE=""
          PLATFORM_ENV_LOCAL=$(mktemp)
          add_platform_env() { [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> "$PLATFORM_ENV_LOCAL" || true; }
          add_platform_env GITHUB_CLIENT_ID "$GH_OAUTH_CLIENT_ID"
          add_platform_env GITHUB_CLIENT_SECRET "$GH_OAUTH_CLIENT_SECRET"
          add_platform_env GITHUB_CALLBACK_URL "$GH_CALLBACK_URL"
          add_platform_env GITHUB_FRONTEND_URL "$GH_FRONTEND_URL"
          add_platform_env GITLAB_CLIENT_ID "$GITLAB_CLIENT_ID"
          add_platform_env GITLAB_CLIENT_SECRET "$GITLAB_CLIENT_SECRET"
          add_platform_env GITLAB_BASE_URL "$GITLAB_BASE_URL"
          add_platform_env GITLAB_CALLBACK_URL "$GITLAB_CALLBACK_URL"
          add_platform_env GITLAB_FRONTEND_URL "$GITLAB_FRONTEND_URL"
          add_platform_env GITVERSE_CLIENT_ID "$GITVERSE_CLIENT_ID"
          add_platform_env GITVERSE_CLIENT_SECRET "$GITVERSE_CLIENT_SECRET"
          add_platform_env YANDEX_CLOUD_ID "$YANDEX_CLOUD_ID"
          add_platform_env YANDEX_FOLDER_ID "$YANDEX_FOLDER_ID"
          add_platform_env YANDEX_CLIENT_ID "$YANDEX_CLIENT_ID"
          add_platform_env YANDEX_CLIENT_SECRET "$YANDEX_CLIENT_SECRET"
          add_platform_env YANDEX_CALLBACK_URL "$YANDEX_CALLBACK_URL"
          add_platform_env YANDEX_FRONTEND_URL "$YANDEX_FRONTEND_URL"
          add_platform_env YANDEX_OAUTH_SCOPE "$YANDEX_OAUTH_SCOPE"
          add_platform_env WEB_SEARCH_PROVIDER "$WEB_SEARCH_PROVIDER"
          add_platform_env YANDEX_SEARCH_API_KEY "$YANDEX_SEARCH_API_KEY"
          add_platform_env YANDEX_SEARCH_FOLDER_ID "$YANDEX_SEARCH_FOLDER_ID"
          add_platform_env TAVILY_API_KEY "$TAVILY_API_KEY"
          add_platform_env PLATFORM_AI_BASE_URL "$PLATFORM_AI_BASE_URL"
          add_platform_env PLATFORM_AI_MODEL "$PLATFORM_AI_MODEL"
          add_platform_env PLATFORM_AI_PROVIDER "$PLATFORM_AI_PROVIDER"
          add_platform_env PLATFORM_AI_API_KEY "$PLATFORM_AI_API_KEY"
          add_platform_env PLATFORM_AI_FREE_BASE_URL "$PLATFORM_AI_FREE_BASE_URL"
          add_platform_env PLATFORM_AI_FREE_MODEL "$PLATFORM_AI_FREE_MODEL"
          add_platform_env PLATFORM_AI_FREE_KEY_1 "$PLATFORM_AI_FREE_KEY_1"
          add_platform_env PLATFORM_AI_FREE_KEY_2 "$PLATFORM_AI_FREE_KEY_2"
          add_platform_env PLATFORM_AI_FREE_KEY_3 "$PLATFORM_AI_FREE_KEY_3"
          add_platform_env PLATFORM_S3_ENDPOINT "$PLATFORM_S3_ENDPOINT"
          add_platform_env PLATFORM_S3_BUCKET "$PLATFORM_S3_BUCKET"
          add_platform_env PLATFORM_S3_REGION "$PLATFORM_S3_REGION"
          add_platform_env PLATFORM_S3_PREFIX "$PLATFORM_S3_PREFIX"
          add_platform_env PLATFORM_S3_ACCESS_KEY_ID "$PLATFORM_S3_ACCESS_KEY_ID"
          add_platform_env PLATFORM_S3_SECRET_ACCESS_KEY "$PLATFORM_S3_SECRET_ACCESS_KEY"
          add_platform_env PROJECT_ARCHIVE_ENABLED "$PROJECT_ARCHIVE_ENABLED"
          add_platform_env PROJECT_ARCHIVE_IDLE_MINUTES "$PROJECT_ARCHIVE_IDLE_MINUTES"
          add_platform_env WEBNESTDEV_ADMIN_EMAILS "$WEBNESTDEV_ADMIN_EMAILS"
          add_platform_env WEBNESTDEV_ADMIN_USER_IDS "$WEBNESTDEV_ADMIN_USER_IDS"
          # Итог по OAuth-ключам — только «есть/нет», без значений. Раньше пустой ключ был
          # виден только по маскированному дампу окружения выше, и «вставлено, но не работает»
          # приходилось разгадывать: здесь причина видна одной строкой.
          has() { [ -n "${1:-}" ] && echo есть || echo нет; }
          echo "[deploy] OAuth GitHub: client_id=$(has "${GH_OAUTH_CLIENT_ID:-}"), secret=$(has "${GH_OAUTH_CLIENT_SECRET:-}")"
          echo "[deploy] OAuth GitLab: client_id=$(has "${GITLAB_CLIENT_ID:-}"), secret=$(has "${GITLAB_CLIENT_SECRET:-}")"
          echo "[deploy] OAuth GitVerse: client_id=$(has "${GITVERSE_CLIENT_ID:-}"), secret=$(has "${GITVERSE_CLIENT_SECRET:-}")"
          echo "[deploy] OAuth Яндекс ID: client_id=$(has "${YANDEX_CLIENT_ID:-}"), secret=$(has "${YANDEX_CLIENT_SECRET:-}")"
          echo "[deploy] Yandex ID redirect_uri: ${YANDEX_CALLBACK_URL:-https://<домен панели>/api/yandex/callback}"
          echo "[deploy] Веб-поиск: Yandex Search API key=$(has "${YANDEX_SEARCH_API_KEY:-}"), folder=$(has "${YANDEX_SEARCH_FOLDER_ID:-}"), Tavily=$(has "${TAVILY_API_KEY:-}")"
          echo "[deploy] Холодный ярус: endpoint=$(has "${PLATFORM_S3_ENDPOINT:-}"), бакет=${PLATFORM_S3_BUCKET:-—}, ключ=$(has "${PLATFORM_S3_ACCESS_KEY_ID:-}"), включён=${PROJECT_ARCHIVE_ENABLED:-0}"
          if [ -s "$PLATFORM_ENV_LOCAL" ]; then
            PLATFORM_ENV_FILE="/tmp/.webnestdev-platform.env"
            tr -d '\r' < "$PLATFORM_ENV_LOCAL" | ssh -i "$HOME/.ssh/deploy_key" \
              -p "${DEPLOY_PORT:-22}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "umask 077; cat > '$PLATFORM_ENV_FILE'"
          fi
          rm -f "$PLATFORM_ENV_LOCAL"
          # Ключ передаётся отдельным потоком, а не аргументом команды: значение секрета в
          # командной строке было бы видно в списке процессов на обеих машинах.
          APP_KEY_FILE=""
          if [ -n "${YANDEX_SA_KEY_JSON:-}" ]; then
            APP_KEY_FILE="/tmp/.webnestdev-app-key.json"
            # CRLF из Windows при вставке секрета ломает PEM внутри JSON: переводы строк там
            # значимые, поэтому возврат каретки убирается до отправки.
            printf '%s\n' "$YANDEX_SA_KEY_JSON" | tr -d '\r' | ssh -i "$HOME/.ssh/deploy_key" \
              -p "${DEPLOY_PORT:-22}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "umask 077; cat > '$APP_KEY_FILE'"
          fi
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "MODE='$MODE' IMAGE_REF='$image' APP_DIR='$DEPLOY_APP_DIR' COMPOSE_B64='$COMPOSE_B64' CADDY_B64='$CADDY_B64' APP_KEY_FILE='$APP_KEY_FILE' PLATFORM_ENV_FILE='$PLATFORM_ENV_FILE' LOG_TAIL='$LOG_TAIL' bash -s" \
            < deploy/scripts/vm-deploy.sh

      - name: Deploy on the VM (self-hosted runner)
        if: ${{ vars.DEPLOY_RUNNER != '' }}
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'image' }}
          LOG_TAIL: ${{ inputs.tail }}
          IMAGE_INPUT: ${{ inputs.image }}
          BUILT_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          YANDEX_SA_KEY_JSON: ${{ secrets.YANDEX_SA_KEY_JSON }}
          # GitHub запрещает секреты и переменные с префиксом GITHUB_ (он зарезервирован под
          # служебные значения), поэтому в настройках репозитория эти два ключа называются
          # GH_OAUTH_CLIENT_ID / GH_OAUTH_CLIENT_SECRET, а в .env попадают под обычными именами,
          # которые читает сервер.
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID || vars.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET || vars.GH_OAUTH_CLIENT_SECRET }}
          GH_CALLBACK_URL: ${{ vars.GH_CALLBACK_URL }}
          GH_FRONTEND_URL: ${{ vars.GH_FRONTEND_URL }}
          # GitLab OAuth. Имена GITLAB_* GitHub не резервирует, поэтому секреты называются так же,
          # как переменные сервера; пустые значения ничего не стирают на ВМ.
          GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID || vars.GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET || vars.GITLAB_CLIENT_SECRET }}
          GITLAB_BASE_URL: ${{ vars.GITLAB_BASE_URL }}
          GITLAB_CALLBACK_URL: ${{ vars.GITLAB_CALLBACK_URL }}
          GITLAB_FRONTEND_URL: ${{ vars.GITLAB_FRONTEND_URL }}
          # GitVerse OAuth: имена не зарезервированы GitHub, поэтому секреты называются так же,
          # как переменные сервера. Без этих двух строк ключи из Secrets до сервера не доезжают.
          GITVERSE_CLIENT_ID: ${{ secrets.GITVERSE_CLIENT_ID || vars.GITVERSE_CLIENT_ID }}
          GITVERSE_CLIENT_SECRET: ${{ secrets.GITVERSE_CLIENT_SECRET || vars.GITVERSE_CLIENT_SECRET }}
          YANDEX_CLOUD_ID: ${{ secrets.YANDEX_CLOUD_ID }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          # Yandex ID OAuth. Префикс YANDEX_ GitHub разрешает (зарезервирован только GITHUB_).
          # `secrets.X || vars.X`: GitHub не отличает «секрет не заведён» от «заведён пустым»,
          # а ключ, сохранённый во вкладке Variables, приходил пустым — кнопка «Подключить»
          # тогда отвечала «OAuth не настроен». Читаются оба места.
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID || vars.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET || vars.YANDEX_CLIENT_SECRET }}
          YANDEX_CALLBACK_URL: ${{ vars.YANDEX_CALLBACK_URL }}
          YANDEX_FRONTEND_URL: ${{ vars.YANDEX_FRONTEND_URL }}
          YANDEX_OAUTH_SCOPE: ${{ vars.YANDEX_OAUTH_SCOPE }}
          # Веб-поиск агента. Ключ Yandex Search API — отдельный (сервисный аккаунт со scope
          # yc.search-api.execute), это не тот ключ, что нужен SMS. Tavily — резерв платных
          # тарифов. Пустые значения не передаются и ничего не стирают на ВМ.
          WEB_SEARCH_PROVIDER: ${{ secrets.WEB_SEARCH_PROVIDER || vars.WEB_SEARCH_PROVIDER }}
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY || vars.YANDEX_SEARCH_API_KEY }}
          YANDEX_SEARCH_FOLDER_ID: ${{ secrets.YANDEX_SEARCH_FOLDER_ID || vars.YANDEX_SEARCH_FOLDER_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || vars.TAVILY_API_KEY }}
          # AI платформы: платная модель — основная для подписок и резерв для бесплатного тарифа.
          # Бесплатная цепочка (Agnes AI) — три ключа из разных аккаунтов, по порядку.
          PLATFORM_AI_BASE_URL: ${{ secrets.PLATFORM_AI_BASE_URL || vars.PLATFORM_AI_BASE_URL }}
          PLATFORM_AI_MODEL: ${{ secrets.PLATFORM_AI_MODEL || vars.PLATFORM_AI_MODEL }}
          PLATFORM_AI_PROVIDER: ${{ secrets.PLATFORM_AI_PROVIDER || vars.PLATFORM_AI_PROVIDER }}
          PLATFORM_AI_API_KEY: ${{ secrets.PLATFORM_AI_API_KEY }}
          PLATFORM_AI_FREE_BASE_URL: ${{ secrets.PLATFORM_AI_FREE_BASE_URL || vars.PLATFORM_AI_FREE_BASE_URL }}
          PLATFORM_AI_FREE_MODEL: ${{ secrets.PLATFORM_AI_FREE_MODEL || vars.PLATFORM_AI_FREE_MODEL }}
          PLATFORM_AI_FREE_KEY_1: ${{ secrets.PLATFORM_AI_FREE_KEY_1 }}
          PLATFORM_AI_FREE_KEY_2: ${{ secrets.PLATFORM_AI_FREE_KEY_2 }}
          PLATFORM_AI_FREE_KEY_3: ${{ secrets.PLATFORM_AI_FREE_KEY_3 }}
          # Холодный ярус проектов: тот же набор, что и в SSH-выкатке (docs/STORAGE.md).
          PLATFORM_S3_ENDPOINT: ${{ secrets.PLATFORM_S3_ENDPOINT || vars.PLATFORM_S3_ENDPOINT }}
          PLATFORM_S3_BUCKET: ${{ secrets.PLATFORM_S3_BUCKET || vars.PLATFORM_S3_BUCKET }}
          PLATFORM_S3_REGION: ${{ secrets.PLATFORM_S3_REGION || vars.PLATFORM_S3_REGION }}
          PLATFORM_S3_PREFIX: ${{ secrets.PLATFORM_S3_PREFIX || vars.PLATFORM_S3_PREFIX }}
          PLATFORM_S3_ACCESS_KEY_ID: ${{ secrets.PLATFORM_S3_ACCESS_KEY_ID }}
          PLATFORM_S3_SECRET_ACCESS_KEY: ${{ secrets.PLATFORM_S3_SECRET_ACCESS_KEY }}
          PROJECT_ARCHIVE_ENABLED: ${{ secrets.PROJECT_ARCHIVE_ENABLED || vars.PROJECT_ARCHIVE_ENABLED }}
          # Минуты простоя до переезда в бакет. Дни остаются поддерживаемым старым ключом,
          # но новый ключ важнее (см. server/src/storage/archive-scheduler.ts).
          PROJECT_ARCHIVE_IDLE_MINUTES: ${{ secrets.PROJECT_ARCHIVE_IDLE_MINUTES || vars.PROJECT_ARCHIVE_IDLE_MINUTES }}
          WEBNESTDEV_ADMIN_EMAILS: ${{ secrets.WEBNESTDEV_ADMIN_EMAILS }}
          WEBNESTDEV_ADMIN_USER_IDS: ${{ secrets.WEBNESTDEV_ADMIN_USER_IDS }}
        run: |
          set -euo pipefail
          image="$IMAGE_INPUT"
          [ -n "$image" ] || image="$BUILT_IMAGE"
          # Ключи платформы и админ панели — в отдельном файле с правами только для владельца.
          PLATFORM_ENV_FILE=$(mktemp)
          add_platform_env() { [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> "$PLATFORM_ENV_FILE" || true; }
          add_platform_env GITHUB_CLIENT_ID "$GH_OAUTH_CLIENT_ID"
          add_platform_env GITHUB_CLIENT_SECRET "$GH_OAUTH_CLIENT_SECRET"
          add_platform_env GITHUB_CALLBACK_URL "$GH_CALLBACK_URL"
          add_platform_env GITHUB_FRONTEND_URL "$GH_FRONTEND_URL"
          add_platform_env GITLAB_CLIENT_ID "$GITLAB_CLIENT_ID"
          add_platform_env GITLAB_CLIENT_SECRET "$GITLAB_CLIENT_SECRET"
          add_platform_env GITLAB_BASE_URL "$GITLAB_BASE_URL"
          add_platform_env GITLAB_CALLBACK_URL "$GITLAB_CALLBACK_URL"
          add_platform_env GITLAB_FRONTEND_URL "$GITLAB_FRONTEND_URL"
          add_platform_env GITVERSE_CLIENT_ID "$GITVERSE_CLIENT_ID"
          add_platform_env GITVERSE_CLIENT_SECRET "$GITVERSE_CLIENT_SECRET"
          add_platform_env YANDEX_CLOUD_ID "$YANDEX_CLOUD_ID"
          add_platform_env YANDEX_FOLDER_ID "$YANDEX_FOLDER_ID"
          add_platform_env YANDEX_CLIENT_ID "$YANDEX_CLIENT_ID"
          add_platform_env YANDEX_CLIENT_SECRET "$YANDEX_CLIENT_SECRET"
          add_platform_env YANDEX_CALLBACK_URL "$YANDEX_CALLBACK_URL"
          add_platform_env YANDEX_FRONTEND_URL "$YANDEX_FRONTEND_URL"
          add_platform_env YANDEX_OAUTH_SCOPE "$YANDEX_OAUTH_SCOPE"
          add_platform_env WEB_SEARCH_PROVIDER "$WEB_SEARCH_PROVIDER"
          add_platform_env YANDEX_SEARCH_API_KEY "$YANDEX_SEARCH_API_KEY"
          add_platform_env YANDEX_SEARCH_FOLDER_ID "$YANDEX_SEARCH_FOLDER_ID"
          add_platform_env TAVILY_API_KEY "$TAVILY_API_KEY"
          add_platform_env PLATFORM_AI_BASE_URL "$PLATFORM_AI_BASE_URL"
          add_platform_env PLATFORM_AI_MODEL "$PLATFORM_AI_MODEL"
          add_platform_env PLATFORM_AI_PROVIDER "$PLATFORM_AI_PROVIDER"
          add_platform_env PLATFORM_AI_API_KEY "$PLATFORM_AI_API_KEY"
          add_platform_env PLATFORM_AI_FREE_BASE_URL "$PLATFORM_AI_FREE_BASE_URL"
          add_platform_env PLATFORM_AI_FREE_MODEL "$PLATFORM_AI_FREE_MODEL"
          add_platform_env PLATFORM_AI_FREE_KEY_1 "$PLATFORM_AI_FREE_KEY_1"
          add_platform_env PLATFORM_AI_FREE_KEY_2 "$PLATFORM_AI_FREE_KEY_2"
          add_platform_env PLATFORM_AI_FREE_KEY_3 "$PLATFORM_AI_FREE_KEY_3"
          add_platform_env PLATFORM_S3_ENDPOINT "$PLATFORM_S3_ENDPOINT"
          add_platform_env PLATFORM_S3_BUCKET "$PLATFORM_S3_BUCKET"
          add_platform_env PLATFORM_S3_REGION "$PLATFORM_S3_REGION"
          add_platform_env PLATFORM_S3_PREFIX "$PLATFORM_S3_PREFIX"
          add_platform_env PLATFORM_S3_ACCESS_KEY_ID "$PLATFORM_S3_ACCESS_KEY_ID"
          add_platform_env PLATFORM_S3_SECRET_ACCESS_KEY "$PLATFORM_S3_SECRET_ACCESS_KEY"
          add_platform_env PROJECT_ARCHIVE_ENABLED "$PROJECT_ARCHIVE_ENABLED"
          add_platform_env PROJECT_ARCHIVE_IDLE_MINUTES "$PROJECT_ARCHIVE_IDLE_MINUTES"
          add_platform_env WEBNESTDEV_ADMIN_EMAILS "$WEBNESTDEV_ADMIN_EMAILS"
          add_platform_env WEBNESTDEV_ADMIN_USER_IDS "$WEBNESTDEV_ADMIN_USER_IDS"
          # На этом раннере скрипт запускается на самой ВМ, поэтому ключ кладётся во временный
          # файл рядом, с правами только для владельца.
          APP_KEY_FILE=""
          if [ -n "${YANDEX_SA_KEY_JSON:-}" ]; then
            APP_KEY_FILE=$(mktemp)
            umask 077
            printf '%s\n' "$YANDEX_SA_KEY_JSON" | tr -d '\r' > "$APP_KEY_FILE"
          fi
          MODE="$MODE" IMAGE_REF="$image" APP_DIR="$DEPLOY_APP_DIR" \
            LOG_TAIL="$LOG_TAIL" \
            COMPOSE_SRC="$PWD/docker-compose.yml" CADDY_SRC="$PWD/deploy/Caddyfile" \
            APP_KEY_FILE="$APP_KEY_FILE" PLATFORM_ENV_FILE="$PLATFORM_ENV_FILE" \
            bash deploy/scripts/vm-deploy.sh
