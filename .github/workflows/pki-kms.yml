name: PostgreSQL PKI via Yandex KMS

# Одноразовая миграция с файлового ca.key на асимметричный ключ Yandex KMS и
# последующая ротация листьев. Приватный ключ CA не покидает KMS; на node-1
# создаются только CSR/листовые ключи. Подписант — этот runner.
#
# Требования:
#   * repository variable YC_KMS_KEY_ID (или input kms_key_id);
#   * secret PKI_KMS_SA_KEY_JSON — ключ сервисного аккаунта с ролями
#     kms.asymmetricSignatureKeys.signer и ...publicKeyViewer на ключ;
#   * environment production (желательно Required reviewers);
#   * секреты DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY уже используются deploy.yml.
#
# migrate меняет доверие: сначала старый+новый CA, затем листья, затем только
# новый CA. Для запуска нужно ввести MIGRATE. rotate не меняет CA и требует ROTATE.
#
# Режим auto (ручной или по расписанию) сначала смотрит остаток срока листьев и
# запускает rotate только если до истечения осталось <= ROTATE_DAYS дней.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto — ротировать только при остатке ≤ 30 дней; migrate — перейти на KMS; rotate — новые листья; verify — только проверка"
        type: choice
        options: ["auto", "verify", "rotate", "migrate"]
        default: "verify"
      confirm:
        description: "Для migrate введите MIGRATE, для rotate — ROTATE"
        type: string
        required: false
      remove_old_key:
        description: "После успешной миграции удалить старый ca.key/ca.srl с node-1"
        type: boolean
        default: true
      kms_key_id:
        description: "ID ключа KMS (по умолчанию repository variable YC_KMS_KEY_ID)"
        type: string
        required: false

  schedule:
    # Проверка срока листьев раз в неделю; rotate выполняется только при
    # остатке <= 30 дней. cron в GitHub работает в UTC.
    - cron: "23 4 * * 1"

concurrency:
  group: pki-kms
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pki:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
      REMOVE_OLD_KEY: ${{ inputs.remove_old_key == true && '1' || '0' }}
      ROTATE_DAYS: "30"
      KMS_KEY_ID: ${{ inputs.kms_key_id || vars.YC_KMS_KEY_ID }}
      PYTHON: python3
      SA_KEY_FILE: /tmp/pki-kms-sa.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install KMS signer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/pki-kms/requirements.txt

      - name: Prepare SSH to node-1
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST_RAW: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_RAW: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT_RAW: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          host=$(printf '%s' "$DEPLOY_HOST_RAW" | tr -d '[:space:]')
          user=$(printf '%s' "${DEPLOY_USER_RAW:-Misha}" | tr -d '[:space:]')
          port=$(printf '%s' "${DEPLOY_PORT_RAW:-22}" | tr -d '[:space:]')
          [ -n "$host" ] || { echo "::error::Не задан DEPLOY_HOST"; exit 1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::Не задан DEPLOY_SSH_KEY"; exit 1; }
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$host" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            echo "DEPLOY_HOST=$host"
            echo "DEPLOY_USER=$user"
            echo "DEPLOY_PORT=$port"
            echo "DEPLOY_SSH_KEY=$HOME/.ssh/deploy_key"
          } >> "$GITHUB_ENV"

      - name: Check certificate expiry
        id: expiry
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'auto' }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$DEPLOY_SSH_KEY" -p "$DEPLOY_PORT" -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)
          now=$(date -u +%s)
          min=""
          for node in node-1 node-2; do
            end=$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "sudo -n openssl x509 -in /etc/webnestdev-ha/pg-pki/nodes/$node/server.crt -noout -enddate" \
              | cut -d= -f2)
            [ -n "$end" ] || { echo "::error::$node: не удалось прочитать срок сертификата"; exit 1; }
            end_ts=$(date -u -d "$end" +%s)
            days=$(( (end_ts - now) / 86400 ))
            echo "$node: осталось $days дн. (до $end)"
            if [ -z "$min" ] || [ "$days" -lt "$min" ]; then min=$days; fi
          done
          if [ "$min" -le "$ROTATE_DAYS" ]; then due=true; else due=false; fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "days_left=$min" >> "$GITHUB_OUTPUT"
          echo "Ближайший сертификат истекает через $min дн.; порог — $ROTATE_DAYS дн.; due=$due"

      - name: Write KMS service account key
        if: ${{ inputs.mode != 'verify' && (github.event_name != 'schedule' && inputs.mode != 'auto' || steps.expiry.outputs.due == 'true') }}
        env:
          PKI_KMS_SA_KEY_JSON: ${{ secrets.PKI_KMS_SA_KEY_JSON }}
        run: |
          set -euo pipefail
          [ -n "${PKI_KMS_SA_KEY_JSON:-}" ] || {
            echo "::error::Не задан GitHub secret PKI_KMS_SA_KEY_JSON"
            exit 1
          }
          umask 077
          printf '%s' "$PKI_KMS_SA_KEY_JSON" > "$SA_KEY_FILE"
          chmod 600 "$SA_KEY_FILE"
          python3 - <<'PY'
          import json, os
          with open(os.environ["SA_KEY_FILE"], encoding="utf-8") as fh:
              key = json.load(fh)
          for name in ("id", "service_account_id", "private_key"):
              if not key.get(name):
                  raise SystemExit(f"service account key: нет {name}")
          print("service account key: структура OK")
          print("service account key: authorized_key_id=" + str(key.get("id")))
          print("service account key: service_account_id=" + str(key.get("service_account_id")))
          PY

      - name: Diagnose KMS access
        if: ${{ inputs.mode != 'verify' && (github.event_name != 'schedule' && inputs.mode != 'auto' || steps.expiry.outputs.due == 'true') }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "deploy/pki-kms")
          import pki_kms
          try:
              client = pki_kms.KmsClient(
                  key_id=os.environ["KMS_KEY_ID"],
                  auth=pki_kms.IamAuth(
                      sa_key_file=os.environ["SA_KEY_FILE"],
                      iam_token=None,
                  ),
              )
          except Exception as exc:
              print("KMS diagnose: client init failed: " + str(exc))
              raise SystemExit(0)
          for label, action in (
              ("get_key", client.get_key),
              ("sign", lambda: client.sign(b"kms-diagnostic")),
              ("public_key", client.public_key),
          ):
              try:
                  result = action()
                  print("KMS diagnose: " + label + "=ok")
              except Exception as exc:
                  print("KMS diagnose: " + label + "=failed: " + str(exc))
          PY

      - name: Migrate, rotate or verify PostgreSQL PKI
        if: ${{ github.event_name != 'schedule' && inputs.mode != 'auto' || steps.expiry.outputs.due == 'true' }}
        env:
          MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'auto') && 'rotate' || inputs.mode }}
          CONFIRM: ${{ (github.event_name == 'schedule' || inputs.mode == 'auto' || inputs.mode == 'rotate') && 'ROTATE' || inputs.confirm }}
        run: bash deploy/pki-kms/run.sh

      - name: Rotation not due
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'auto') && steps.expiry.outputs.due != 'true' }}
        run: echo "Сертификаты действительны ещё ${{ steps.expiry.outputs.days_left }} дн. (порог $ROTATE_DAYS) — ротация не нужна."

      - name: Summary
        if: always()
        run: |
          {
            echo "### PostgreSQL PKI via Yandex KMS"
            echo ""
            echo "- Mode: \`${{ env.REQUESTED_MODE }}\`"
            echo "- KMS key: \`${{ env.KMS_KEY_ID }}\`"
            echo "- Результат: **${{ job.status }}**"
            if [ -n "${{ steps.expiry.outputs.days_left }}" ]; then
              echo "- Ближайший сертификат: ${{ steps.expiry.outputs.days_left }} дн. до истечения (порог $ROTATE_DAYS)"
            fi
            echo ""
            echo "После успешной миграции:"
            echo "1. PostgreSQL CA backup пропускается сам: файлового ca.key больше нет."
            echo "2. Локальный auto-rotate не включай: у node-1 нет прав KMS."
            echo "3. Еженедельный auto проверяет срок и ротирует только при остатке ≤ $ROTATE_DAYS дней."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove service account key from runner
        if: always()
        run: rm -f "$SA_KEY_FILE"
