name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        # Ставим только браузер. `--with-deps` тянет шрифты и X-библиотеки через apt, а на
        # ubuntu-latest нужные для тестов библиотеки уже есть. Если зеркало apt не резолвится,
        # `--with-deps` ждёт по 20 секунд на пакет и растягивает шаг на десять минут — без него
        # установка занимает секунды. Три попытки переживают сбой CDN Playwright.
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            echo "Playwright install failed (attempt $attempt), retrying…" >&2
            sleep 10
          done
          exit 1
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Test server
        run: npm test
        working-directory: server

      - name: Test Docker broker
        run: npm run test:broker

      - name: Test PostgreSQL backup scripts
        run: bash deploy/scripts/pg-backup.test.sh

      - name: Build web
        run: npm run build
