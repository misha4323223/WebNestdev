name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        # Ставим только браузер. `--with-deps` тянет шрифты и X-библиотеки через apt, а на
        # ubuntu-latest нужные для тестов библиотеки уже есть. Если зеркало apt не резолвится,
        # `--with-deps` ждёт по 20 секунд на пакет и растягивает шаг на десять минут — без него
        # установка занимает секунды. Три попытки переживают сбой CDN Playwright.
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            echo "Playwright install failed (attempt $attempt), retrying…" >&2
            sleep 10
          done
          exit 1
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Test server
        run: npm test
        working-directory: server

      - name: Test Docker broker
        run: npm run test:broker

      - name: Test PostgreSQL backup scripts
        run: bash deploy/scripts/pg-backup.test.sh

      - name: Build web
        run: npm run build

  infrastructure:
    # Проверки, которым нужен Docker или Python-окружение, но не нужен полный Node-образ:
    # песочница агента их не запускает, поэтому CI — единственное автоматическое место.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Только для `docker compose config`; это не production-секреты.
      POSTGRES_PASSWORD: ci-postgres-password
      WEBNESTDEV_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      WEBNESTDEV_ALLOWED_ORIGINS: http://127.0.0.1:3000
      NODE2_PG_PASSWORD: ci-node2-password
      NODE1_RUNNER_TOKEN: ci-runner-token
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HA shell syntax
        run: bash -n deploy/scripts/node2-sync.sh deploy/ha/install-node1.sh deploy/ha/install-node2.sh deploy/ha/standby.sh deploy/ha/pg_tls.sh deploy/ha/pg_hba_probe.sh deploy/ha/pg_pki.sh deploy/pki-kms/run.sh

      - name: Install PKI KMS signer dependencies
        run: python3 -m pip install --disable-pip-version-check -r deploy/pki-kms/requirements.txt

      - name: Test PKI KMS signer
        run: python3 -m unittest discover -s deploy/pki-kms -p 'test_*.py' -v

      - name: Test HA controller and storage scripts
        # Тесты не требуют MWS/cryptography: их зависимости подменяются в самих тестах.
        run: python3 -m unittest discover -p 'test_*.py'
        working-directory: deploy/ha

      - name: Validate node-1 compose configuration
        run: docker compose -f docker-compose.yml -f deploy/node1/docker-compose.override.yml config --quiet

      - name: Validate node-2 compose configuration
        run: docker compose -f docker-compose.yml -f deploy/node2/docker-compose.override.yml config --quiet
