name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Test server
        run: npm test
        working-directory: server

      - name: Test Docker broker
        run: npm run test:broker

      - name: Test PostgreSQL backup scripts
        run: bash deploy/scripts/pg-backup.test.sh

      - name: Build web
        run: npm run build
