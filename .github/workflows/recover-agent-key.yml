name: recover-agent-key

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-agent-key.yml

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Install temporary public key on node-1
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILihnY16TNPKxI/wt0FAq1cvsQM0goeLVei1g3ZyR33f codebuff-webnestdev"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && (grep -qxF '$PUBKEY' ~/.ssh/authorized_keys || printf '%s\n' '$PUBKEY' >> ~/.ssh/authorized_keys)"
