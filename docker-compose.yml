services:
  webnestdev-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8787
      WEBNESTDEV_STORAGE: ydb
      WEBNESTDEV_PHONE_OTP_SECRET: ${WEBNESTDEV_PHONE_OTP_SECRET:?Set a dedicated 32+ character OTP secret}
      WEBNESTDEV_SMS_MODE: ${WEBNESTDEV_SMS_MODE:-smsru}
      SMSRU_API_ID: ${SMSRU_API_ID:?Set the SMS.RU API ID}
      WEBNESTDEV_SMS_MAX_PER_HOUR: ${WEBNESTDEV_SMS_MAX_PER_HOUR:-100}
      WEBNESTDEV_PHONE_CONSENT_VERSION: ${WEBNESTDEV_PHONE_CONSENT_VERSION:-phone-auth-v1}
      WEBNESTDEV_ENCRYPTION_KEY: ${WEBNESTDEV_ENCRYPTION_KEY:?Set a 32-byte base64 or 64-character hex encryption key}
      WEBNESTDEV_ALLOWED_ORIGINS: ${WEBNESTDEV_ALLOWED_ORIGINS:?Set the public frontend origin(s), comma-separated}
      YDB_CONNECTION_STRING: ${YDB_CONNECTION_STRING:?Set the YDB connection string}
      YDB_TOKEN: ${YDB_TOKEN:-}
      YDB_TABLE_PREFIX: ${YDB_TABLE_PREFIX:-webnestdev}
      SANDBOX_MODE: docker
      SANDBOX_IMAGE: node:22-bookworm-slim
      SANDBOX_MEMORY: 1g
      SANDBOX_CPUS: 1
      SANDBOX_PIDS_LIMIT: 128
      SANDBOX_NETWORK: none
    ports:
      - "8787:8787"
    volumes:
      - webnestdev-data:/app/.webnestdev
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  webnestdev-data:
