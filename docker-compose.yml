services:
  webnestdev-server:
    build:
      context: ./server
    environment:
      PORT: 8787
      SANDBOX_MODE: docker
      SANDBOX_IMAGE: node:22-bookworm-slim
      SANDBOX_MEMORY: 1g
      SANDBOX_CPUS: 1
      SANDBOX_PIDS_LIMIT: 128
      SANDBOX_NETWORK: none
    ports:
      - "8787:8787"
    volumes:
      - webnestdev-data:/app/.webnestdev
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  webnestdev-data:
