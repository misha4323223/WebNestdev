services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webnestdev}
      POSTGRES_USER: ${POSTGRES_USER:-webnestdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # База остаётся в старой сети вместе с сервером: переносить её в новую сеть значило бы
    # пересоздавать рабочую сеть на живой ВМ. Предпросмотры же уходят в отдельную сеть и до
    # postgres:5432 не доходят (см. docs/SECURITY.md).
    networks:
      - webnestdev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webnestdev} -d ${POSTGRES_DB:-webnestdev}"]
      interval: 5s
      timeout: 3s
      retries: 10

  #
  # Фронт с HTTPS: панель на основном домене и публичные адреса предпросмотра
  # (`<проект>.preview.домен`). Сертификаты для поддоменов предпросмотра выдаются по запросу
  # (`on_demand` + endpoint /api/preview/tls-ask), а лежат они в томе `caddy-data`: без тома
  # каждая выкатка заново запрашивала бы сертификаты и упиралась в лимиты Let's Encrypt.
  # Домены задаются переменными; без них Caddy поднимется с `localhost` и никому не помешает.
  #
  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - webnestdev-server
    environment:
      # Дефолт — домен этого продакшена: без строки в .env caddy слушает localhost и наружу
      # не смотрит (HTTPS не работает). .env на ВМ может переопределить.
      WEBNESTDEV_SITE_DOMAIN: ${WEBNESTDEV_SITE_DOMAIN:-nestdev.ru}
      PREVIEW_PUBLIC_DOMAIN: ${PREVIEW_PUBLIC_DOMAIN:-preview.nestdev.ru}
      ACME_EMAIL: ${ACME_EMAIL:-nestdev@mail.ru}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Панельная сеть — новая и с фиксированным адресом: сервер доверяет X-Forwarded-For только
    # этому прокси. Старую сеть `webnestdev` не трогаем, чтобы выкатка не пересоздавала её на
    # живой ВМ с уже запущенными контейнерами предпросмотра.
    networks:
      webnestdev-panel:
        ipv4_address: ${WEBNESTDEV_CADDY_IP:-10.77.0.10}
    restart: unless-stopped

  webnestdev-server:
    # Образ приходит из реестра при деплое (WEBNESTDEV_IMAGE задаёт GitHub Actions);
    # ключ build остаётся для локальной сборки через `docker compose build`.
    image: ${WEBNESTDEV_IMAGE:-webnestdev:production}
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      WEBNESTDEV_STORAGE: postgres
      WEBNESTDEV_ENCRYPTION_KEY: ${WEBNESTDEV_ENCRYPTION_KEY:?Set a 32-byte base64 or 64-character hex encryption key}
      # Отдельная соль для хеша IP в журнале секретов; пусто — используется ключ шифрования.
      WEBNESTDEV_AUDIT_SALT: ${WEBNESTDEV_AUDIT_SALT:-}
      WEBNESTDEV_ALLOWED_ORIGINS: ${WEBNESTDEV_ALLOWED_ORIGINS:?Set the public frontend origin(s), comma-separated}
      # Кому доверять X-Forwarded-For. Адрес Caddy задан статически выше; контейнер предпросмотра
      # в эту сеть не входит, поэтому подменить адрес клиента он не может.
      WEBNESTDEV_TRUSTED_PROXIES: ${WEBNESTDEV_TRUSTED_PROXIES:-10.77.0.10}
      DATABASE_URL: postgres://${POSTGRES_USER:-webnestdev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-webnestdev}
      # Yandex Cloud OAuth (optional)
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_CALLBACK_URL: ${YANDEX_CALLBACK_URL:-}
      YANDEX_FRONTEND_URL: ${YANDEX_FRONTEND_URL:-}
      YANDEX_OAUTH_SCOPE: ${YANDEX_OAUTH_SCOPE:-cloud-api}
      # GitHub OAuth (optional)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GITHUB_FRONTEND_URL: ${GITHUB_FRONTEND_URL:-}
      # GitLab OAuth (optional; свой GitLab — в GITLAB_BASE_URL)
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_CALLBACK_URL: ${GITLAB_CALLBACK_URL:-}
      GITLAB_FRONTEND_URL: ${GITLAB_FRONTEND_URL:-}
      # GitVerse OAuth (optional; PKCE делает сервер). Без этих двух строк ключи, положенные
      # в .env на ВМ, до сервера не доходили бы: compose передаёт только перечисленное.
      GITVERSE_CLIENT_ID: ${GITVERSE_CLIENT_ID:-}
      GITVERSE_CLIENT_SECRET: ${GITVERSE_CLIENT_SECRET:-}
      # AI Provider (optional)
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      # Модель платформы: то, чем пользуются проекты без своего провайдера. Значения из .env —
      # запасной источник; те же ключи, введённые в панели «Ключи сервера», читаются из DATA_DIR
      # и переживают выкатку (см. server/src/platform/platform-env.ts).
      PLATFORM_AI_PROVIDER: ${PLATFORM_AI_PROVIDER:-}
      PLATFORM_AI_BASE_URL: ${PLATFORM_AI_BASE_URL:-}
      PLATFORM_AI_MODEL: ${PLATFORM_AI_MODEL:-}
      PLATFORM_AI_API_KEY: ${PLATFORM_AI_API_KEY:-}
      # Холодный ярус проектов: архив рабочей папки в S3-совместимом бакете (docs/STORAGE.md).
      # Compose передаёт в контейнер только перечисленные переменные, поэтому без этого блока
      # ключи, положенные в .env на ВМ, до сервера не доходили бы — как это уже случилось
      # с ключами SMS. Пустые значения безвредны: хранилище просто считается не настроенным.
      PLATFORM_S3_ENDPOINT: ${PLATFORM_S3_ENDPOINT:-}
      PLATFORM_S3_REGION: ${PLATFORM_S3_REGION:-}
      PLATFORM_S3_BUCKET: ${PLATFORM_S3_BUCKET:-}
      PLATFORM_S3_PREFIX: ${PLATFORM_S3_PREFIX:-}
      PLATFORM_S3_ACCESS_KEY_ID: ${PLATFORM_S3_ACCESS_KEY_ID:-}
      PLATFORM_S3_SECRET_ACCESS_KEY: ${PLATFORM_S3_SECRET_ACCESS_KEY:-}
      # 0 — проекты остаются на диске; 1 — простой дольше PROJECT_ARCHIVE_IDLE_MINUTES минут
      # уезжает в бакет и освобождает диск ВМ. Включается осознанно: первое открытие проекта
      # после простоя сначала скачивает архив. Обход раз в 10 минут, чтобы «час простоя»
      # действительно означал час, а не «час плюс до шести часов ожидания обхода».
      PROJECT_ARCHIVE_ENABLED: ${PROJECT_ARCHIVE_ENABLED:-0}
      PROJECT_ARCHIVE_IDLE_MINUTES: ${PROJECT_ARCHIVE_IDLE_MINUTES:-360}
      PROJECT_ARCHIVE_SWEEP_INTERVAL_MS: ${PROJECT_ARCHIVE_SWEEP_INTERVAL_MS:-600000}
      # Веб-поиск агента. `auto` — провайдер по тарифу: бесплатный ищет через DuckDuckGo без ключей,
      # платные — Yandex Search API, а Tavily страхует его как резерв. Перечислено явно, потому что
      # Compose не передаёт в контейнер переменные, которых нет в этом списке: ключ, положенный в .env
      # на ВМ, иначе просто не дошёл бы до сервера.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-auto}
      YANDEX_SEARCH_API_KEY: ${YANDEX_SEARCH_API_KEY:-}
      YANDEX_SEARCH_FOLDER_ID: ${YANDEX_SEARCH_FOLDER_ID:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Кто может менять ключи платформы. Только из окружения и намеренно не из панели: иначе
      # доступ к ключам сервиса можно было бы расширить изнутри панели. Пусто — панель закрыта
      # и объясняет, как назначить администратора.
      WEBNESTDEV_ADMIN_EMAILS: ${WEBNESTDEV_ADMIN_EMAILS:-}
      WEBNESTDEV_ADMIN_USER_IDS: ${WEBNESTDEV_ADMIN_USER_IDS:-}
      # Вход по номеру телефона. Compose передаёт в контейнер только перечисленные здесь
      # переменные: ключи SMS-провайдера, лежавшие в .env, до сервера не доходили, вход по
      # номеру молча переходил в тестовый режим (код только в логах), а выкатка ещё и
      # затирала compose на ВМ вместе с ручными правками. Пустое значение безвредно —
      # провайдер выбирается по наличию ключа; Yandex Cloud — первым.
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_SENDER: ${SMS_SENDER:-}
      YANDEX_NOTIFY_IAM_TOKEN: ${YANDEX_NOTIFY_IAM_TOKEN:-}
      YANDEX_SA_KEY: ${YANDEX_SA_KEY:-}
      YANDEX_SA_KEY_FILE: ${YANDEX_SA_KEY_FILE:-}
      YANDEX_CLOUD_ID: ${YANDEX_CLOUD_ID:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_SMS_SENDER: ${YANDEX_SMS_SENDER:-}
      YANDEX_NOTIFY_ENDPOINT: ${YANDEX_NOTIFY_ENDPOINT:-}
      # Каталог секретов виден и серверу: в нём он ищет ключ сервисного аккаунта, когда путь из
      # YANDEX_SA_KEY_FILE не открылся (например указывает внутрь образа — /app/yandex-sa-key.json).
      # Значение совпадает с монтированием ниже, поэтому имя переменной здесь то же.
      WEBNESTDEV_SECRETS_DIR: ${WEBNESTDEV_SECRETS_DIR:-/var/lib/webnestdev/secrets}
      SMS_RU_API_ID: ${SMS_RU_API_ID:-}
      SMSC_LOGIN: ${SMSC_LOGIN:-}
      SMSC_PASSWORD: ${SMSC_PASSWORD:-}
      EXOLVE_API_KEY: ${EXOLVE_API_KEY:-}
      SMSAERO_EMAIL: ${SMSAERO_EMAIL:-}
      SMSAERO_API_KEY: ${SMSAERO_API_KEY:-}
      WEBNESTDEV_SMS_TEST_MODE: ${WEBNESTDEV_SMS_TEST_MODE:-}
      WEBNESTDEV_DEMO_PHONE_ENABLED: ${WEBNESTDEV_DEMO_PHONE_ENABLED:-}
      WEBNESTDEV_DEMO_PHONE: ${WEBNESTDEV_DEMO_PHONE:-}
      # Песочницы и предпросмотр монтируются в контейнеры проектов через `docker run -v`,
      # а этот путь разбирает демон на ХОСТЕ. Поэтому каталог обязан существовать на хосте и
      # в контейнере под одним и тем же абсолютным путём — иначе контейнеры видят пустой
      # каталог, пока агент пишет файлы в серверный. `WEBNESTDEV_SANDBOX_DIR` задаёт его
      # внутри сервера, второй пункт монтирования — тот же путь с хоста.
      WEBNESTDEV_SANDBOX_DIR: ${SANDBOX_DIR:-/var/lib/webnestdev/sandboxes}
      # Явно, а не через молчаливый фолбэк: если это значение когда-нибудь разойдётся с
      # монтированием ниже, сервер отдаст контейнерам правильный путь вместо угадывания.
      WEBNESTDEV_SANDBOX_HOST_DIR: ${SANDBOX_DIR:-/var/lib/webnestdev/sandboxes}
      SANDBOX_MODE: docker
      SANDBOX_IMAGE: node:22-bookworm-slim
      SANDBOX_MEMORY: 1g
      SANDBOX_CPUS: 1
      SANDBOX_PIDS_LIMIT: 128
      SANDBOX_NETWORK: none
      # Предпросмотр: auto — статическая сборка, когда проект собирается, иначе dev-сервер
      # в контейнере. container — прежнее поведение, static — без контейнера предпросмотра
      # вообще (см. docs/PRODUCTION_DEPLOYMENT.md).
      PREVIEW_MODE: ${PREVIEW_MODE:-auto}
      # Остальные настройки предпросмотра — тоже здесь, и это не формальность: compose передаёт в
      # контейнер ТОЛЬКО перечисленные переменные. Пока их тут не было, совет из документации
      # «задайте PREVIEW_NETWORK в .env и выкатите снова» ничего не менял: значение оставалось в
      # .env на хосте, сервер его не видел, и белый экран в панели выглядел неисправимым.
      # По умолчанию — выделенная сеть предпросмотров: она нужна серверу, чтобы дойти до
      # контейнера, но в ней нет базы. Пустое значение оставляет выбор сети самому серверу.
      PREVIEW_NETWORK: ${PREVIEW_NETWORK:-webnestdev-preview}
      PREVIEW_IDLE_MS: ${PREVIEW_IDLE_MS:-300000}
      # Сколько контейнерных предпросмотров держит один аккаунт. 1 — правило продукта: второй
      # предпросмотр того же человека останавливает его же прежний. 0 — без ограничения.
      PREVIEW_MAX_PER_USER: ${PREVIEW_MAX_PER_USER:-1}
      # Необязательный предохранитель на весь хост (сумма по всем аккаунтам). По умолчанию выключен:
      # места считаются на аккаунт, а не на машину. Тесному хосту стоит задать число, например 4.
      PREVIEW_MAX_CONTAINERS: ${PREVIEW_MAX_CONTAINERS:-0}
      PREVIEW_PROXY_TIMEOUT_MS: ${PREVIEW_PROXY_TIMEOUT_MS:-30000}
      # Деградировавший режим (панель отдаётся через `docker exec`, см. preview/exec-proxy.ts):
      # сколько запросов идёт внутрь контейнера одновременно, сколько ждёт и как часто повторять
      # проверку недоступного адреса.
      PREVIEW_EXEC_MAX_CONCURRENT: ${PREVIEW_EXEC_MAX_CONCURRENT:-4}
      PREVIEW_EXEC_MAX_QUEUE: ${PREVIEW_EXEC_MAX_QUEUE:-64}
      PREVIEW_EXEC_QUEUE_TIMEOUT_MS: ${PREVIEW_EXEC_QUEUE_TIMEOUT_MS:-60000}
      PREVIEW_EXEC_RETRY_MS: ${PREVIEW_EXEC_RETRY_MS:-60000}
      # Публичный адрес предпросмотра: `<проект>.<домен>` отдаётся отдельным слушателем на
      # PREVIEW_HOST_PORT (в него смотрит реверс-прокси, см. deploy/Caddyfile). Пустое значение —
      # публичных адресов нет, и предпросмотр остаётся доступным только путём в панели.
      PREVIEW_PUBLIC_DOMAIN: ${PREVIEW_PUBLIC_DOMAIN:-}
      PREVIEW_HOST_PORT: ${PREVIEW_HOST_PORT:-8788}
      PREVIEW_HOST_BIND: ${PREVIEW_HOST_BIND:-0.0.0.0}
      # Сколько живёт билет на публичный адрес: столько может быть открыта вкладка предпросмотра.
      PREVIEW_TICKET_TTL_MS: ${PREVIEW_TICKET_TTL_MS:-43200000}
      # Сколько диалогов с агентом этот хост ведёт одновременно. Прогон почти всё время ждёт
      # модель, поэтому дефолт 8: память ограничивают контейнеры, а не прогоны (см. ниже).
      AGENT_MAX_CONCURRENT_RUNS: ${AGENT_MAX_CONCURRENT_RUNS:-8}
      # Сколько контейнеров-команд (install/build/git/терминал) стартует одновременно — это и
      # есть настоящий лимит памяти хоста: SANDBOX_MEMORY на контейнер. И на аккаунт не больше
      # одного прогона. На 2 ГБ ВМ хватает 2, на 8 ГБ — 4 и больше (docs/PRODUCTION_DEPLOYMENT.md).
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
      SANDBOX_MAX_QUEUE: ${SANDBOX_MAX_QUEUE:-32}
      SANDBOX_QUEUE_TIMEOUT_MS: ${SANDBOX_QUEUE_TIMEOUT_MS:-180000}
      BROWSER_MAX_CONCURRENT: ${BROWSER_MAX_CONCURRENT:-1}
    ports:
      - "8787:8787"
    volumes:
      - webnestdev-data:/app/.webnestdev
      - ${SANDBOX_DIR:-/var/lib/webnestdev/sandboxes}:${SANDBOX_DIR:-/var/lib/webnestdev/sandboxes}
      # Ключ сервисного аккаунта Yandex Cloud лежит файлом: это JSON с переносами строк,
      # в .env он неудобен и легко обрезается. Читается тем же путём внутри контейнера,
      # поэтому YANDEX_SA_KEY_FILE=/var/lib/webnestdev/secrets/yandex-sa-key.json.
      - ${WEBNESTDEV_SECRETS_DIR:-/var/lib/webnestdev/secrets}:/var/lib/webnestdev/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # Сервер стоит в трёх сетях: база, панель (Caddy) и предпросмотры.
    networks:
      - webnestdev
      - webnestdev-panel
      - webnestdev-preview
    restart: unless-stopped

volumes:
  webnestdev-data:
  postgres-data:
  # Сертификаты и ключи Caddy. Именованный том, а не каталог внутри контейнера: без него каждая
  # выкатка начиналась бы с пустого хранилища сертификатов, и выдача на поддомены предпросмотра
  # упиралась бы в недельный лимит Let's Encrypt.
  caddy-data:
  caddy-config:

networks:
  # Старая сеть: postgres и сервер. Конфигурация намеренно не меняется — Compose не будет её
  # пересоздавать, а значит выкатка не упадёт из-за подключённых контейнеров предпросмотра.
  webnestdev:
  # Панель и Caddy: новая сеть с фиксированной подсетью. От адреса Caddy зависит доверие
  # X-Forwarded-For; при смене подсети задайте WEBNESTDEV_CADDY_IP и
  # WEBNESTDEV_TRUSTED_PROXIES согласованно. Подсеть 10.77.0.0/24 выбрана вне диапазона, который
  # Docker обычно раздаёт автоматически; если она занята на хосте, Docker ответит «pool overlaps» —
  # тогда задайте свои три значения.
  webnestdev-panel:
    ipam:
      config:
        - subnet: ${WEBNESTDEV_NETWORK_SUBNET:-10.77.0.0/24}
  # Предпросмотры пользовательских проектов: egress в интернет нужен dev-серверу, а базы и
  # Caddy в этой сети нет.
  webnestdev-preview:
